[workspace]
resolver = "3"
members = [
    "crates/bareclip-app",
    "crates/bareclip-audio",
    "crates/bareclip-capture",
    "crates/bareclip-core",
    "crates/bareclip-export",
    "crates/bareclip-media",
    "crates/bareclip-render",
    "crates/bareclip-text",
]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
bareclip-audio = { path = "crates/bareclip-audio" }
bareclip-capture = { path = "crates/bareclip-capture" }
bareclip-core = { path = "crates/bareclip-core" }
bareclip-export = { path = "crates/bareclip-export" }
bareclip-media = { path = "crates/bareclip-media" }
bareclip-render = { path = "crates/bareclip-render" }
bareclip-text = { path = "crates/bareclip-text" }
bytemuck = "1"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
cpal = "0.18"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
# Noise suppression. Without its default features it leaves out its command-line tool.
nnnoiseless = { version = "0.5.2", default-features = false }
pollster = "1"
rfd = "0.17"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shadcn-egui-core = "0.7"
shadcn-egui-icons-lucide = "0.7"
# Draws the library's shapes. Already part of the build through the font engine.
zeno = "0.3.3"
wgpu = "30"
# Windows' screen capture, which needs its COM and WinRT interfaces. Already part of the build
# through the graphics and sound libraries.
windows = { version = "0.62", features = ["Foundation", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_WindowsAndMessaging"] }
# The COM support the screen capture library uses, named directly so its macro can implement
# a callback Windows calls when one program's sound is ready to be listened to.
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Com", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }

# Test and dev builds keep only line numbers for errors, which takes far less disk than full
# debugging detail. Debugging step by step would want this off.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
